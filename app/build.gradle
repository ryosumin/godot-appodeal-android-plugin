plugins {
    id 'com.android.library'
}

ext.libraryName = "Appodeal"
ext.libraryVersionCode = 2
ext.libraryVersionName = "2.0.0"

android {
    namespace 'com.dnhnd.godotappodeal'
    compileSdk 36

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode libraryVersionCode
        versionName libraryVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    libraryVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "$libraryName-$libraryVersionName-${variant.name}.aar"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.appodeal.ads:sdk:3.12.0.+'
    compileOnly 'org.godotengine:godot:3.6.2.stable'
    //compileOnly fileTree(dir:"libs", include:["godot-lib.3.5.3.stable.release.aar"])
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}